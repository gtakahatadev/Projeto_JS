<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" class="css" />
  </head>
  <body>
    <header class="header">
      <nav class="header__menu">
        <img class="header__img" src="./assets/logo_black.svg" alt="" />
        <ul class="header__nav">
          <li class="nav__item">Features</li>
          <li class="nav__item">Team</li>
          <li class="nav__item">Sign In</li>
        </ul>
      </nav>
      <section class="header__hero">
        <div class="hero__left">
          <h2 class="left__title">All your files in one secure location, accessible anywhere.</h2>
          <p class="left__parag">Fylo stores your most important files in one secure location. Access them wherever you need, share and collaborate with friends, family, and co-workers.</p>
          <span class="hero__form">
            <input class="form__input" type="email" placeholder="Enter your email..." id="form_input">
            <button id="form__button">Get Started</button>
          </span>
        </div>
        <div class="hero__right">
          <img class="right__img" src="./assets/img_hero.svg" alt="">
        </div>
      </section>
    </header>
  </body>
</html>
